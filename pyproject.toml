[project]
name = "lecture"
version = "0.1.0"
description = ""
authors = [
    {name = "Ihor Melnyk"}
]
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "Django>=5.2.17,<6.0",
    "django-environ>=0.11.2",
    "gunicorn>=23.0.0",
    "Pillow>=12.3.0,<13.0",
    "psycopg2-binary>=2.9.10",
    "mutagen>=1.47.0,<2.0.0",
    "djangorestframework>=3.17.2,<4.0.0",
    "gevent>=25.8.2",
    "django-storages[s3]>=1.14.6",
]

[dependency-groups]
dev = [
    "black>=24.10.0,<25.0.0",
    "ruff>=0.9.1,<0.10.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
# One-off design scripts (the app icon's renderer), not app code.
extend-exclude = ["design"]
