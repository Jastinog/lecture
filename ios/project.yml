name: Lecture
options:
  bundleIdPrefix: com.personal
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: "29J695XTV5"
    CODE_SIGN_STYLE: Automatic

targets:
  Lecture:
    type: application
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: Sources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.personal.lecture
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: Sources/Info.plist
      properties:
        CFBundleDisplayName: Lectures
        CFBundleShortVersionString: "1.0"
        CFBundleDevelopmentRegion: en
        CFBundleLocalizations:
          - en
        UILaunchScreen: {}
        # The iOS 6 look draws its own glossy bars; opt out of Liquid Glass so
        # UIKit keeps the classic opaque bars the appearance proxies style.
        UIDesignRequiresCompatibility: true
        # White status-bar text everywhere: it sits on the blue, wooden or
        # black bars on every screen.
        UIViewControllerBasedStatusBarAppearance: false
        UIStatusBarStyle: UIStatusBarStyleLightContent
        UIBackgroundModes:
          - audio
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
