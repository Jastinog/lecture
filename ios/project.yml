name: Lecture
options:
  bundleIdPrefix: com.personal
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: "29J695XTV5"
    CODE_SIGN_STYLE: Automatic

targets:
  Lecture:
    type: application
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: Sources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.personal.lecture
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # The Django backend the app reads its catalog from (`API.baseURL`).
        API_BASE_URL: "https://lecture.intentio.pro"
      configs:
        # The dev server on this Mac. A device can't reach its 127.0.0.1: use
        # the Mac's LAN IP or a tunnel.
        Debug:
          API_BASE_URL: "http://127.0.0.1:8765"
    info:
      path: Sources/Info.plist
      properties:
        CFBundleDisplayName: Lectures
        APIBaseURL: $(API_BASE_URL)
        # Plain http to a dev server on this Mac or the local network.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        CFBundleShortVersionString: "1.0"
        CFBundleDevelopmentRegion: en
        CFBundleLocalizations:
          - en
        UILaunchScreen: {}
        # The iOS 6 look draws its own glossy bars; opt out of Liquid Glass so
        # UIKit keeps the classic opaque bars the appearance proxies style.
        UIDesignRequiresCompatibility: true
        # White status-bar text everywhere: it sits on the blue, wooden or
        # black bars on every screen.
        UIViewControllerBasedStatusBarAppearance: false
        UIStatusBarStyle: UIStatusBarStyleLightContent
        UIBackgroundModes:
          - audio
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
